<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NOE · Enlaces</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#111;--mute:#767676;--line:#ececec;--soft:#f7f7f7;--r:10px}
*{box-sizing:border-box}
html,body{margin:0;background:#fff;color:var(--ink);font-family:'Hanken Grotesk',system-ui,sans-serif;font-size:15px;line-height:1.45}
.wrap{max-width:1040px;margin:0 auto;padding:48px 24px 80px}
header{display:flex;justify-content:center;margin:8px 0 48px}
h1.logo{margin:0;width:min(460px,78%);line-height:0}
h1.logo img{width:100%;height:auto;display:block}
.bar{display:flex;gap:12px;margin-bottom:16px}
.bar .search{margin-bottom:0;flex:1}
.bar .btn{white-space:nowrap}
button{font:inherit;cursor:pointer}
.btn{background:var(--ink);color:#fff;border:0;border-radius:var(--r);padding:10px 16px;font-weight:500}
.btn:hover{background:#333}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.search{width:100%;border:1px solid var(--line);border-radius:var(--r);padding:11px 14px;font:inherit;margin-bottom:16px}
.search:focus{outline:none;border-color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:32px}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 14px;color:var(--mute)}
.chip:hover{color:var(--ink);border-color:#ccc}
.chip[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:#fff}
.chip small{opacity:.6;margin-left:4px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:20px}
.card{border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;background:#fff;position:relative}
.card:hover{border-color:#cfcfcf}
.thumb{aspect-ratio:16/9;display:grid;place-items:center;font-size:44px;font-weight:600;letter-spacing:-.02em;border-bottom:1px solid var(--line)}
.thumb img{width:100%;height:100%;object-fit:cover}
.body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:4px;flex:1}
.body a{color:inherit;text-decoration:none;font-weight:600}
.body a::after{content:"";position:absolute;inset:0}
.body a:hover{text-decoration:underline}
.dom{color:var(--mute);font-size:13px}
.desc{color:#444;font-size:14px;margin-top:2px}
.meta{margin-top:auto;padding-top:12px;font-size:13px;color:var(--mute);display:flex;justify-content:space-between;align-items:center}
.del{position:relative;z-index:1;background:none;border:0;color:var(--mute);padding:2px 6px;border-radius:6px}
.del:hover{background:var(--soft);color:var(--ink)}
.empty{grid-column:1/-1;text-align:center;color:var(--mute);padding:64px 0}
dialog{border:1px solid var(--line);border-radius:14px;padding:24px;width:min(420px,92vw);box-shadow:0 20px 60px rgba(0,0,0,.12)}
dialog::backdrop{background:rgba(255,255,255,.7)}
dialog h2{margin:0 0 16px;font-size:18px}
label{display:block;font-size:13px;color:var(--mute);margin:12px 0 6px}
input,select{width:100%;border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;font:inherit;background:#fff}
input:focus,select:focus{outline:none;border-color:var(--ink)}
.row{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}
.note{margin-top:48px;color:var(--mute);font-size:13px;border-top:1px solid var(--line);padding-top:16px}
@media(max-width:520px){.wrap{padding:28px 16px 60px}header{margin-bottom:32px}}
[hidden]{display:none!important}
.loginbox{max-width:340px;margin:0 auto}
.loginbox .btn{width:100%;margin-top:20px}
.err{color:#b3261e;font-size:13px;margin-top:12px;min-height:1em}
.desc{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.btn[disabled]{opacity:.5;cursor:default}
.cfg{max-width:520px;margin:0 auto;color:#444}
.cfg code{background:var(--soft);padding:2px 6px;border-radius:6px}
</style>
</head>

  <section id="cfg" class="cfg" hidden>
    <p>Falta conectar la base de datos. Abre <code>index.html</code> y pega tu URL y tu clave de Supabase en las dos primeras líneas del script. Los pasos están en <code>LEEME.md</code>.</p>
  </section>

  <section id="login" hidden>
    <form class="loginbox" id="loginForm">
      <label for="em">Correo</label>
      <input id="em" type="email" autocomplete="username" required>
      <label for="pw">Contraseña</label>
      <input id="pw" type="password" autocomplete="current-password" required>
      <button class="btn" id="enter" type="submit">Entrar</button>
      <div class="err" id="lerr" role="alert"></div>
    </form>
  </section>

  <section id="app" hidden>
    <div class="bar">
      <input class="search" id="q" type="search" placeholder="Buscar por título o sitio" aria-label="Buscar">
      <button class="btn" id="add" type="button">Agregar enlace</button>
      <button class="btn ghost" id="out" type="button">Salir</button>
    </div>
    <div class="chips" id="chips"></div>
    <div class="err" id="msg" role="alert"></div>
    <main class="grid" id="grid"></main>
  </section>
</div>

<dialog id="dlg">
  <h2>Nuevo enlace</h2>
  <label for="url">Dirección</label>
  <input id="url" type="text" inputmode="url" placeholder="https://">
  <label for="ttl">Título (opcional)</label>
  <input id="ttl" type="text" placeholder="Se completa solo desde la página">
  <label for="cat">Categoría</label>
  <input id="cat" list="cats" type="text" placeholder="Elige una o escribe una nueva">
  <datalist id="cats"></datalist>
  <div class="err" id="derr" role="alert"></div>
  <div class="row">
    <button class="btn ghost" id="cancel" type="button">Cancelar</button>
    <button class="btn" id="save" type="button">Guardar enlace</button>
  </div>
</dialog>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const SUPABASE_URL='https://xoglglsriuwiqxkzpykh.supabase.co';
const SUPABASE_KEY='sb_publishable_e7gjW-89ds2A2TRr5CDkjw_rOvf2n8m';

const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const host=u=>{try{return new URL(u).hostname.replace(/^www\./,'')}catch(e){return u}};
const hue=s=>{let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))%360;return h};
const safe=u=>/^https?:\/\//i.test(u)?u:'#';
let sb,links=[],active='Todas',term='';

if(SUPABASE_URL.startsWith('PEGA')||SUPABASE_KEY.startsWith('PEGA')){
  $('#cfg').hidden=false;
}else{
  sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
  sb.auth.onAuthStateChange((_e,session)=>{setTimeout(()=>session?enter():leave(),0)});
}

function leave(){links=[];$('#app').hidden=true;$('#login').hidden=false;$('#grid').innerHTML='';}
async function enter(){$('#login').hidden=true;$('#app').hidden=false;await load();}

$('#loginForm').onsubmit=async e=>{
  e.preventDefault();$('#lerr').textContent='';
  const b=$('#enter');b.disabled=true;b.textContent='Entrando…';
  const {error}=await sb.auth.signInWithPassword({email:$('#em').value.trim(),password:$('#pw').value});
  b.disabled=false;b.textContent='Entrar';
  if(error)$('#lerr').textContent='Correo o contraseña incorrectos.';
};
$('#out').onclick=()=>sb.auth.signOut();

async function load(){
  $('#msg').textContent='';
  const {data,error}=await sb.from('links').select('*').order('created_at',{ascending:false});
  if(error){$('#msg').textContent='No se pudieron cargar los enlaces. Revisa tu conexión.';return}
  links=data;render();
}

function render(){
  const cats=[...new Set(links.map(l=>l.category))].sort((a,b)=>a.localeCompare(b,'es'));
  if(active!=='Todas'&&!cats.includes(active))active='Todas';
  $('#chips').innerHTML=['Todas',...cats].map(n=>{
    const c=n==='Todas'?links.length:links.filter(l=>l.category===n).length;
    return `<button class="chip" aria-pressed="${n===active}" data-c="${esc(n)}">${esc(n)}<small>${c}</small></button>`}).join('');
  const t=term.toLowerCase();
  const list=links.filter(l=>(active==='Todas'||l.category===active)&&(!t||(l.title+' '+host(l.url)).toLowerCase().includes(t)));
  $('#grid').innerHTML=list.length?list.map(l=>{
    const h=hue(host(l.url)),d=new Date(l.created_at).toLocaleDateString('es',{day:'numeric',month:'short'});
    return `<article class="card">
      <div class="thumb" style="background:hsl(${h},40%,96%);color:hsl(${h},45%,40%)">${l.image?`<img src="${esc(l.image)}" alt="" loading="lazy" referrerpolicy="no-referrer">`:esc(host(l.url)[0].toUpperCase())}</div>
      <div class="body">
        <a href="${esc(safe(l.url))}" target="_blank" rel="noopener">${esc(l.title)}</a>
        <span class="dom">${esc(host(l.url))}</span>
        ${l.description?`<span class="desc">${esc(l.description)}</span>`:''}
        <div class="meta"><span>${esc(l.category)} · ${d}</span><button class="del" data-id="${esc(l.id)}" aria-label="Eliminar enlace">Eliminar</button></div>
      </div></article>`}).join(''):'<div class="empty">No hay enlaces aquí todavía. Agrega el primero.</div>';
}
// si una imagen de vista previa falla, se muestra la inicial del sitio
document.addEventListener('error',e=>{
  const i=e.target;if(i.tagName==='IMG'&&i.closest('.thumb')){const t=i.closest('.thumb');const a=t.closest('.card').querySelector('.dom').textContent;t.textContent=a[0].toUpperCase();}
},true);

$('#chips').onclick=e=>{const b=e.target.closest('.chip');if(b){active=b.dataset.c;render()}};
$('#q').oninput=e=>{term=e.target.value;render()};
$('#grid').onclick=async e=>{
  const b=e.target.closest('.del');if(!b||!confirm('¿Eliminar este enlace?'))return;
  const {error}=await sb.from('links').delete().eq('id',b.dataset.id);
  if(error){$('#msg').textContent='No se pudo eliminar. Inténtalo de nuevo.';return}
  links=links.filter(l=>l.id!==b.dataset.id);render();
};

$('#add').onclick=()=>{
  $('#url').value='';$('#ttl').value='';$('#derr').textContent='';
  $('#cat').value=active!=='Todas'?active:'';
  const cats=[...new Set(['General',...links.map(l=>l.category)])];
  $('#cats').innerHTML=cats.map(c=>`<option value="${esc(c)}">`).join('');
  $('#dlg').showModal();$('#url').focus();
};
$('#cancel').onclick=()=>$('#dlg').close();

async function preview(url){
  const ctl=new AbortController(),t=setTimeout(()=>ctl.abort(),9000);
  try{
    const r=await fetch('https://api.microlink.io/?url='+encodeURIComponent(url),{signal:ctl.signal});
    const j=await r.json();
    if(j.status!=='success')return {};
    const d=j.data||{};
    return {title:d.title,description:d.description,image:(d.image&&d.image.url)||(d.logo&&d.logo.url)||null};
  }catch(e){return {}}finally{clearTimeout(t)}
}

$('#save').onclick=async()=>{
  let u=$('#url').value.trim();if(!u)return;
  if(!/^https?:\/\//i.test(u))u='https://'+u;
  try{new URL(u)}catch(e){$('#derr').textContent='La dirección no es válida.';return}
  const b=$('#save');b.disabled=true;b.textContent='Guardando…';$('#derr').textContent='';
  const p=await preview(u);
  const row={url:u,title:$('#ttl').value.trim()||p.title||host(u),description:p.description||null,image:p.image||null,category:$('#cat').value.trim()||'General'};
  const {data,error}=await sb.from('links').insert(row).select().single();
  b.disabled=false;b.textContent='Guardar enlace';
  if(error){$('#derr').textContent='No se pudo guardar. Inténtalo de nuevo.';return}
  links.unshift(data);$('#dlg').close();render();
};
</script>
</body>
</html>
